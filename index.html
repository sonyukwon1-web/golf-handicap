<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#9971;</text></svg>" />
    <meta name="theme-color" content="#1e6b3a" />
    <meta name="description" content="낙원 골프 — 라운드 기록과 핸디캡을 자동으로 관리합니다." />

    <!--
      카카오톡·메시지에 주소를 붙였을 때 뜨는 미리보기.

      **그림 주소는 반드시 절대 주소(https://…)** 여야 한다. 카톡 서버가 우리
      집 밖에서 그 그림을 가지러 오기 때문에, /og.png 처럼 적어 두면 못 찾는다.
      1200×630 은 카톡·페북·슬랙이 공통으로 잘 받는 크기다.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="낙원 골프" />
    <meta property="og:title" content="낙원 골프" />
    <meta property="og:description" content="라운드 기록과 핸디캡을 자동으로. 스코어카드 사진 한 장이면 끝납니다." />
    <meta property="og:url" content="https://nakwongolf.vercel.app/" />
    <meta property="og:image" content="https://nakwongolf.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ko_KR" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="낙원 골프" />
    <meta name="twitter:description" content="라운드 기록과 핸디캡을 자동으로." />
    <meta name="twitter:image" content="https://nakwongolf.vercel.app/og.png" />
    <!--
      디자인이 부르는 글꼴 둘. 안 실으면 시스템 글꼴로 떨어져 같은 CSS 라도
      다른 화면이 된다 — 특히 Oswald 는 좁고 키 큰 숫자라 시상대의 큰 수와
      순위 숫자의 인상이 통째로 달라진다.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&display=swap"
    />
    <title>낙원 골프</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
